
name: Hetzner CX33 Stock Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check CX33 availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          url = "https://hetzner.thegoated.dev/api/availability"

          def check_stock():
              req = urllib.request.Request(
                  url, headers={"User-Agent": "CX33-stock-monitor/1.0"}
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)

              cx33 = next(
                  server
                  for family in data["families"]
                  for server in family["types"]
                  if server["code"] == "CX33"
              )

              return cx33["stock"]

          locations = ["FSN1", "NBG1"]

          # Primera comprobación
          first_check = check_stock()
          print("Primera comprobación:", first_check)

          # Esperar 10 segundos
          time.sleep(10)

          # Segunda comprobación
          second_check = check_stock()
          print("Segunda comprobación:", second_check)

          state_file = Path("cx33_state.json")
          previous = (
              json.loads(state_file.read_text())
              if state_file.exists() else {}
          )

          current = {}

          for loc in locations:
              first = first_check.get(loc, "unknown")
              second = second_check.get(loc, "unknown")

              # Solo dos confirmaciones exactas de available
              if first == "available" and second == "available":
                  current[loc] = "available"
              elif second == "available":
                  current[loc] = "unconfirmed"
              else:
                  current[loc] = second

          newly_available = [
              loc for loc in locations
              if current[loc] == "available"
              and previous.get(loc) != "available"
          ]

          if newly_available:
              message = (
                  "🚨 ¡HETZNER CX33 DISPONIBLE!\n\n"
                  + "\n".join(
                      f"{loc}: AVAILABLE" for loc in newly_available
                  )
                  + "\n\n¡Comprueba el servidor ahora!"
              )

              api = (
                  "https://api.telegram.org/bot"
                  + os.environ["TELEGRAM_BOT_TOKEN"]
                  + "/sendMessage"
              )

              payload = json.dumps({
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": message
              }).encode()

              request = urllib.request.Request(
                  api,
                  data=payload,
                  headers={"Content-Type": "application/json"}
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  print(response.read().decode())

          state_file.write_text(json.dumps(current, indent=2))

          print("Estado anterior:", previous)
          print("Estado actual:", current)
          print("Nuevas disponibilidades:", newly_available)
          PY

      - name: Save availability state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cx33_state.json
          git diff --cached --quiet || (
            git commit -m "Update CX33 stock state" &&
            git push
          )
